name: Worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/worker-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push compatible worker image
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/stockfish-worker:latest
            ghcr.io/${{ github.repository }}/stockfish-worker:${{ github.sha }}
          build-args: |
            STOCKFISH_REF=sf_18
            STOCKFISH_ARCH=x86-64-avx2
            STOCKFISH_BUILD_TARGET=profile-build
          cache-from: type=gha,scope=worker-compatible
          cache-to: type=gha,mode=max,scope=worker-compatible

      - name: Build and push Genoa worker image
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/stockfish-worker:genoa
            ghcr.io/${{ github.repository }}/stockfish-worker:genoa-${{ github.sha }}
          build-args: |
            STOCKFISH_REF=sf_18
            STOCKFISH_ARCH=x86-64-vnni512
            STOCKFISH_BUILD_TARGET=build
          cache-from: type=gha,scope=worker-genoa
          cache-to: type=gha,mode=max,scope=worker-genoa
